<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>ATELIER · Learning Progress</title>
<style>
:root{
  --cream:#f5f0e8;
  --burgundy:#541c21;
  --rose:#b5a682;
  --sage:#718575;
  --ink:#252b30;
  --paper:#fffdf9;
  --muted:#766f68;
  --line:#ded4c6;
  --navy:#041f3c;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  background:transparent;
  color:var(--ink);
  font:14px/1.65 'Bai Jamjuree',sans-serif;
}
button,a{font:inherit}
.progress-screen,.progress-screen *{font-family:'Bai Jamjuree',sans-serif!important}
.progress-screen{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:clamp(22px,4vw,48px) clamp(16px,4vw,48px) 40px;
}
.breadcrumb{
  display:flex;align-items:center;gap:10px;
  margin-bottom:24px;color:#9a8d86;font-size:12px;
}
.breadcrumb a{
  color:var(--burgundy);text-decoration:none;font-weight:600;
}
.breadcrumb a:hover{text-decoration:underline}
.section-heading{margin:8px 0 28px}
.progress-heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.language-toggle{
  flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);padding:8px 14px;color:var(--burgundy);
  font-size:12px;font-weight:700;cursor:pointer;
}
.language-toggle:hover{background:#f5e9e6;border-color:#e6cfca}
.eyebrow{
  color:var(--sage);font-size:10px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
}
h1,h2,h3,p{margin-top:0}
.section-heading h1{
  margin:14px 0 8px;color:var(--burgundy);
  font-size:clamp(30px,5vw,48px);line-height:1.2;font-weight:700;
}
.section-heading p{color:var(--muted);line-height:1.7;margin:0}
h2{
  margin:0;color:var(--burgundy);font-size:22px;
  line-height:1.4;font-weight:600;
}
.progress-overview-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;margin:22px 0 34px;
}
.result-stat{
  min-height:116px;display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
}
.result-stat strong{
  color:var(--burgundy);font-size:clamp(27px,3vw,38px);
  line-height:1.15;font-weight:700;
}
.result-stat span{color:var(--muted);font-size:12px}
.progress-subheading{margin:34px 0 16px}
.progress-subheading h2{font-weight:600}
.progress-mode-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
}
.progress-mode-card{
  min-width:0;margin:0;padding:18px 20px;display:flex;flex-direction:column;gap:9px;
  background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:16px;
}
.mode-pill{
  display:inline-flex;align-items:center;width:max-content;max-width:100%;
  padding:5px 10px;border:1px solid transparent;border-radius:999px;
  font-size:10px;font-weight:700;line-height:1.45;letter-spacing:.025em;
}
.mode-pill-matching{color:#713c48;background:#f5e9e6;border-color:#e6cfca}
.mode-pill-scenario{color:#385c62;background:#e9f1ef;border-color:#c8dcda}
.mode-pill-keyboard{color:#65518a;background:#f0ebf7;border-color:#d9d0e8}
.replay-pill,.unfinished-pill{
  display:inline-flex;align-items:center;width:max-content;padding:4px 9px;
  border-radius:999px;font-size:10px;font-weight:700;
}
.replay-pill{background:#f6f0df;color:#80632f}
.unfinished-pill{background:#f2ece7;color:#76665d}
.progress-mode-attempts{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.progress-mode-attempts strong{color:var(--burgundy);font-size:32px;line-height:1;font-weight:700}
.progress-mode-attempts span,.progress-mode-meta span{color:var(--muted);font-size:11px}
.progress-mode-meta{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:7px;border-top:1px solid var(--line);
}
.progress-mode-meta b{color:var(--burgundy);font-size:14px}
.progress-mode-card>small{color:var(--muted);font-size:10px}
.progress-chapter-list,.progress-attempt-list{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
}
.progress-chapter-card{
  min-width:0;margin:0;padding:20px;display:flex;flex-direction:column;gap:15px;
  background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:16px;
}
.chapter-progress-meta{font-size:13px;color:var(--burgundy)}
.chapter-progress-meta b{font-weight:700}
.mode-progress-row{display:grid;gap:6px}
.mode-progress-label{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  color:var(--muted);font-size:11px;
}
.mode-progress-label b{color:var(--burgundy);font-size:12px;font-weight:700}
.progress-track{width:100%;height:7px;margin:0;overflow:hidden;background:#eadeda;border-radius:99px}
.progress-track i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.progress-track.scenario-track i{background:#668b8b}
.progress-track.keyboard-track i{background:#9179ad}
.mode-progress-row>small{color:var(--muted);font-size:10px}
.progress-attempt-card{
  min-width:0;margin:0;padding:16px 18px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;
  background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:16px;
}
.progress-attempt-topline{
  grid-column:1/-1;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.progress-attempt-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.progress-attempt-main strong{color:var(--burgundy);font-size:14px;font-weight:700}
.progress-attempt-main small{color:var(--muted);font-size:10px}
.progress-attempt-main .chapter-reference{
  color:var(--sage);font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;
}
.progress-attempt-card>b{color:var(--burgundy);font-size:19px;font-weight:700}
.progress-attempt-score{
  grid-column:1/-1;padding-top:6px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11px;
}
.status{
  padding:24px;border:1px dashed var(--line);border-radius:14px;
  color:var(--muted);background:rgba(255,253,249,.65);
}
.status.error{color:var(--burgundy)}
@media(max-width:760px){
  .progress-mode-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .progress-screen{padding:20px 14px 28px}
  .progress-overview-grid{grid-template-columns:1fr 1fr;gap:10px}
  .progress-overview-grid .result-stat:last-child{grid-column:1/-1}
  .progress-chapter-list,.progress-attempt-list{grid-template-columns:1fr}
  .progress-chapter-card{padding:16px}
  .progress-mode-card{padding:16px}
  .section-heading h1{font-size:32px}
}
</style>
</head>
<body>
<main class="progress-screen" id="progress-screen">
  <div class="breadcrumb">
    <a href="https://atelierprojectmedi.wixsite.com/group9" target="_top" rel="noopener">← <span id="back-home">กลับหน้าแรก</span></a>
    <span>/</span><span>PROGRESS</span>
  </div>
  <div class="section-heading">
    <div class="progress-heading-row">
      <div>
        <div class="eyebrow">ATELIER · LEARNING JOURNAL</div>
        <h1 id="title">ความคืบหน้าการเรียนรู้</h1>
        <p id="subtitle">ภาพรวมการเรียนรู้</p>
      </div>
      <button type="button" class="language-toggle" id="language-toggle">EN</button>
    </div>
  </div>
  <div class="progress-overview-grid">
    <article class="result-stat"><strong id="completed">—</strong><span id="completed-label">บทเรียนที่จับคู่ครบ</span></article>
    <article class="result-stat"><strong id="attempts">—</strong><span id="attempts-label">จำนวนรอบที่เล่น</span></article>
    <article class="result-stat"><strong id="accuracy">—</strong><span id="accuracy-label">อัตราการตอบถูก</span></article>
  </div>
  <div class="section-heading progress-subheading"><h2 id="mode-heading">ความคืบหน้าแยกตามประเภทเกม</h2></div>
  <div class="progress-mode-grid" id="mode-stats">
    <div class="status">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="section-heading progress-subheading"><h2 id="chapter-heading">ความคืบหน้าของบทเรียน</h2></div>
  <div class="progress-chapter-list" id="chapters">
    <div class="status">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="section-heading progress-subheading"><h2 id="history-heading">ประวัติการฝึก</h2></div>
  <div class="progress-attempt-list" id="history">
    <div class="status">กำลังโหลดข้อมูล...</div>
  </div>
</main>
<script>
(function(){
  'use strict';
  var lang='th';
  var requestNumber=0;
  var currentProgress=null;
  var currentHistory=[];
  var COPY={
    th:{
      backHome:'กลับหน้าแรก',title:'ความคืบหน้าการเรียนรู้',subtitle:'ภาพรวมการเรียนรู้',
      completed:'บทเรียนที่จับคู่ครบ',attempts:'จำนวนรอบที่เล่น',accuracy:'อัตราการตอบถูก',
      modeHeading:'ความคืบหน้าแยกตามประเภทเกม',chapterHeading:'ความคืบหน้าของบทเรียน',
      historyHeading:'ประวัติการฝึก',matching:'เกมจับคู่ · MATCHING',
      scenario:'เกมสถานการณ์ · SCENARIO',keyboard:'เกมคีย์ลัด · KEYBOARD',
      rounds:'รอบที่เล่น',finished:'รอบที่จบ',accuracyLabel:'ความถูกต้อง',
      correct:'ตอบถูก',replay:'ฝึกซ้ำ',unfinished:'ยังไม่จบ',
      matchingProgress:'ความคืบหน้าเกมจับคู่',
      scenarioProgress:'ความคืบหน้าเกมสถานการณ์',
      keyboardProgress:'ความคืบหน้าเกมคีย์ลัด',
      remaining:'ข้อที่เหลือ',loading:'กำลังโหลดข้อมูล...',
      noData:'ยังไม่มีข้อมูลการฝึก',signIn:'กรุณาเข้าสู่ระบบสมาชิกเพื่อดูผลการเรียนรู้',
      loadError:'โหลดข้อมูลไม่สำเร็จ',of:'จาก'
    },
    en:{
      backHome:'Home',title:'My Learning Progress',subtitle:'Learning overview',
      completed:'Matching-complete chapters',attempts:'Practice rounds',accuracy:'Answer accuracy',
      modeHeading:'Progress by game mode',chapterHeading:'Chapter progress',
      historyHeading:'Practice history',matching:'MATCHING GAME',
      scenario:'SCENARIO GAME',keyboard:'KEYBOARD CHALLENGE',
      rounds:'Rounds played',finished:'Rounds completed',accuracyLabel:'Accuracy',
      correct:'Correct',replay:'REPLAY',unfinished:'IN PROGRESS',
      matchingProgress:'Matching progress',scenarioProgress:'Scenario progress',
      keyboardProgress:'Keyboard progress',remaining:'remaining',
      loading:'Loading your learning progress...',noData:'No practice data yet',
      signIn:'Please sign in to view your learning progress',
      loadError:'Unable to load progress',of:'of'
    }
  };
  function t(key){return COPY[lang][key]||key;}
  function byId(id){return document.getElementById(id);}
  function setText(id,value){byId(id).textContent=value;}
  function escapeHtml(value){
    return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function localized(value,fallback){
    if(value&&typeof value==='object') return value[lang]||value.th||value.en||fallback||'';
    return value||fallback||'';
  }
  function modeName(mode){
    if(mode==='scenario')return t('scenario');
    if(mode==='keyboard')return t('keyboard');
    return t('matching');
  }
  function modeClass(mode){
    if(mode==='scenario')return 'scenario';
    if(mode==='keyboard')return 'keyboard';
    return 'matching';
  }
  function formatTime(ms){
    var value=Number(ms)||0;
    var minutes=Math.floor(value/60000);
    var seconds=Math.floor((value%60000)/1000);
    return minutes?minutes+'m '+seconds+'s':seconds+'s';
  }
  function render(progress,history){
    currentProgress=progress||{};
    currentHistory=Array.isArray(history)?history:[];
    setText('back-home',t('backHome'));
    setText('title',t('title'));
    setText('subtitle',t('subtitle'));
    setText('completed-label',t('completed'));
    setText('attempts-label',t('attempts'));
    setText('accuracy-label',t('accuracy'));
    setText('mode-heading',t('modeHeading'));
    setText('chapter-heading',t('chapterHeading'));
    setText('history-heading',t('historyHeading'));
    setText('completed',(progress.completedChapterCount||0)+'/'+((progress.chapters||[]).length||0));
    setText('attempts',String(progress.totalAttempts||0));
    setText('accuracy',(progress.accuracyPercent||0)+'%');

    var modes=['matching','scenario','keyboard'];
    byId('mode-stats').innerHTML=modes.map(function(mode){
      var stats=(progress.modeStats&&progress.modeStats[mode])||{};
      var cls=modeClass(mode);
      var replayLine=mode==='matching'&&(stats.replayCount||0)>0
        ?'<small>'+t('replay')+': '+stats.replayCount+'</small>':'';
      return '<article class="progress-mode-card progress-mode-'+cls+'">'+
        '<span class="mode-pill mode-pill-'+cls+'">'+modeName(mode)+'</span>'+
        '<div class="progress-mode-attempts"><strong>'+Number(stats.attemptCount||0)+'</strong><span>'+t('rounds')+'</span></div>'+
        '<div class="progress-mode-meta"><span>'+t('finished')+'</span><b>'+Number(stats.completedAttempts||0)+'</b></div>'+
        '<div class="progress-mode-meta"><span>'+t('accuracyLabel')+'</span><b>'+Number(stats.accuracyPercent||0)+'%</b></div>'+
        '<small>'+Number(stats.correctAnswers||0)+'/'+Number(stats.answerCount||0)+' '+t('correct')+'</small>'+
        replayLine+
      '</article>';
    }).join('');

    var chapters=Array.isArray(progress.chapters)?progress.chapters:[];
    if(!chapters.length){
      byId('chapters').innerHTML='<div class="status">'+t('noData')+'</div>';
    }else{
      byId('chapters').innerHTML=chapters.slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).map(function(ch){
        var title=localized(ch.title,ch.chapterId);
        var matching=Number(ch.matchingProgressPercent!=null?ch.matchingProgressPercent:ch.progressPercent)||0;
        var scenario=Number(ch.scenarioProgressPercent)||0;
        var keyboard=Number(ch.keyboardProgressPercent)||0;
        return '<article class="progress-chapter-card">'+
          '<div class="chapter-progress-meta"><b>'+String(ch.order||0).padStart(2,'0')+' · '+escapeHtml(title)+'</b></div>'+
          '<div class="mode-progress-row">'+
            '<div class="mode-progress-label"><span>'+t('matchingProgress')+'</span><b>'+matching+'%</b></div>'+
            '<div class="progress-track"><i style="width:'+Math.max(0,Math.min(100,matching))+'%"></i></div>'+
            '<small>'+Number(ch.matchingCompleted||0)+'/'+Number(ch.matchingTotal||0)+' · '+Number(ch.remaining||0)+' '+t('remaining')+'</small>'+
          '</div>'+
          '<div class="mode-progress-row">'+
            '<div class="mode-progress-label"><span>'+t('scenarioProgress')+'</span><b>'+scenario+'%</b></div>'+
            '<div class="progress-track scenario-track"><i style="width:'+Math.max(0,Math.min(100,scenario))+'%"></i></div>'+
            '<small>'+Number(ch.scenarioQuestionsResolved||0)+'/'+Number(ch.scenarioQuestionsTotal||0)+'</small>'+
          '</div>'+
          '<div class="mode-progress-row">'+
            '<div class="mode-progress-label"><span>'+t('keyboardProgress')+'</span><b>'+keyboard+'%</b></div>'+
            '<div class="progress-track keyboard-track"><i style="width:'+Math.max(0,Math.min(100,keyboard))+'%"></i></div>'+
            '<small>'+Number(ch.keyboardQuestionsResolved||0)+'/'+Number(ch.keyboardQuestionsTotal||0)+'</small>'+
          '</div>'+
        '</article>';
      }).join('');
    }

    if(!currentHistory.length){
      byId('history').innerHTML='<div class="status">'+t('noData')+'</div>';
    }else{
      byId('history').innerHTML=currentHistory.map(function(attempt){
        var chapter=chapters.find(function(ch){return ch.chapterId===attempt.chapterId;});
        var chapterTitle=localized(chapter&&chapter.title,attempt.chapterId);
        var chapterReference=chapter&&chapter.order
          ?(lang==='th'?'บทที่ ':'CHAPTER ')+String(chapter.order).padStart(2,'0')
          :attempt.chapterId;
        var cls=modeClass(attempt.mode);
        var date=attempt.startTime?new Date(attempt.startTime).toLocaleString(lang==='th'?'th-TH':'en-US'):'';
        var badges='<span class="mode-pill mode-pill-'+cls+'">'+modeName(attempt.mode)+'</span>';
        if(attempt.isReplay)badges+='<span class="replay-pill">'+t('replay')+'</span>';
        if(attempt.status==='in_progress')badges+='<span class="unfinished-pill">'+t('unfinished')+'</span>';
        return '<article class="progress-attempt-card progress-attempt-'+cls+'">'+
          '<div class="progress-attempt-topline">'+badges+'</div>'+
          '<div class="progress-attempt-main"><small class="chapter-reference">'+escapeHtml(chapterReference)+'</small><strong>'+escapeHtml(chapterTitle)+'</strong><small>'+escapeHtml(date)+'</small></div>'+
          '<b>'+Number(attempt.correctCount||0)+'/'+Number(attempt.totalQuestions||0)+'</b>'+
          '<small class="progress-attempt-score">'+Number(attempt.scorePercent||0)+'% · '+formatTime(attempt.timeSpentMs||0)+'</small>'+
        '</article>';
      }).join('');
    }
  }
  function showError(message){
    var output='<div class="status error">'+escapeHtml(message)+'</div>';
    byId('mode-stats').innerHTML=output;
    byId('chapters').innerHTML=output;
    byId('history').innerHTML='';
  }
  function request(){
    requestNumber++;
    var id='progress_'+Date.now()+'_'+requestNumber;
    byId('mode-stats').innerHTML='<div class="status">'+t('loading')+'</div>';
    byId('chapters').innerHTML='<div class="status">'+t('loading')+'</div>';
    byId('history').innerHTML='<div class="status">'+t('loading')+'</div>';
    window.parent.postMessage({
      channel:'ATELIER_PROGRESS',
      kind:'request',
      requestId:id,
      method:'loadProgress'
    },'*');
  }
  window.addEventListener('message',function(event){
    if(event.source!==window.parent)return;
    var msg=event.data;
    if(!msg||msg.channel!=='ATELIER_PROGRESS'||msg.kind!=='response')return;
    if(!msg.ok){
      showError(String(msg.error||'').indexOf('MEMBER_LOGIN_REQUIRED')>=0?t('signIn'):t('loadError'));
      return;
    }
    render(msg.data&&msg.data.progress,msg.data&&msg.data.history);
  });
  document.addEventListener('click',function(event){
    if(event.target&&event.target.id==='language-toggle'){
      lang=lang==='th'?'en':'th';
      if(currentProgress)render(currentProgress,currentHistory);
    }
  });
  // Render a stable shell before requesting member-scoped data.
  render({completedChapterCount:0,totalAttempts:0,accuracyPercent:0,modeStats:{},chapters:[]},[]);
  request();
})();
</script>
</body>
</html>
