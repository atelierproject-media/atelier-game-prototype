<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATELIER · Learning Progress</title>
<style>
:root{--ink:#173047;--burgundy:#713c48;--sage:#718575;--muted:#7d7771;--line:#eadeda;--paper:#fffdf9;--rose:#c98282}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:14px/1.55 Arial,sans-serif}
.shell{max-width:1100px;margin:0 auto;padding:18px 8px 28px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.eyebrow{color:var(--sage);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
h1{margin:5px 0 4px;color:var(--burgundy);font:500 clamp(28px,4vw,42px)/1.1 Georgia,serif}
.sub{margin:0;color:var(--muted)}
.toggle{border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:7px 12px;color:var(--burgundy);font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 30px}
.kpi,.chapter,.attempt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi b{display:block;color:var(--burgundy);font:700 clamp(26px,3vw,36px)/1.1 Georgia,serif;margin-bottom:6px}
.kpi span{color:var(--muted);font-size:12px}
.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
h2{font:500 22px Georgia,serif;color:var(--burgundy);margin:0}
.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chapter-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.chapter-title b{color:var(--burgundy);font-size:14px}
.percent{font:700 18px Georgia,serif;color:var(--burgundy);white-space:nowrap}
.track{height:8px;background:#eadeda;border-radius:99px;overflow:hidden;margin:14px 0 8px}
.track i{display:block;height:100%;background:var(--sage);border-radius:99px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.activity{display:grid;gap:10px}
.attempt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px 12px;padding:14px 16px}
.attempt b{color:var(--burgundy)}
.attempt small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.score{color:var(--burgundy);font:700 18px Georgia,serif}
.status{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:rgba(255,253,249,.65)}
.error{color:var(--burgundy)}
@media(max-width:650px){.shell{padding:12px 4px 20px}.kpis{gap:8px}.kpi{padding:13px}.kpi span{font-size:10px}.chapter-grid{grid-template-columns:1fr}.attempt{padding:13px}.header{align-items:center}}
@media(max-width:400px){.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div><div class="eyebrow">ATELIER · LEARNING JOURNAL</div><h1 id="title">ความคืบหน้าการเรียนรู้</h1><p class="sub" id="subtitle">ติดตามพัฒนาการจากการฝึก Mini Tasks</p></div>
    <button class="toggle" id="language">EN</button>
  </header>
  <div class="kpis">
    <article class="kpi"><b id="completed">—</b><span id="completed-label">บทเรียนที่เรียนครบ</span></article>
    <article class="kpi"><b id="attempts">—</b><span id="attempts-label">จำนวนรอบที่เล่น</span></article>
    <article class="kpi"><b id="accuracy">—</b><span id="accuracy-label">อัตราการตอบถูก</span></article>
  </div>
  <section>
    <div class="section"><h2 id="chapter-heading">ความคืบหน้ารายบท</h2></div>
    <div class="chapter-grid" id="chapters"><div class="status" id="loading">กำลังโหลดข้อมูล...</div></div>
  </section>
  <section>
    <div class="section"><h2 id="activity-heading">ประวัติการฝึกล่าสุด</h2></div>
    <div class="activity" id="history"><div class="status">กำลังโหลดข้อมูล...</div></div>
  </section>
</div>
<script>
(function(){
  var lang='th',sequence=0;
  var strings={
    th:{title:'ความคืบหน้าการเรียนรู้',subtitle:'ติดตามพัฒนาการจากการฝึก Mini Tasks',completed:'บทเรียนที่เรียนครบ',attempts:'จำนวนรอบที่เล่น',accuracy:'อัตราการตอบถูก',chapters:'ความคืบหน้ารายบท',history:'ประวัติการฝึกล่าสุด',loading:'กำลังโหลดข้อมูล...',noData:'ยังไม่มีข้อมูลการฝึก เริ่มเล่น Mini Tasks เพื่อบันทึกพัฒนาการของคุณ',failed:'โหลดข้อมูลไม่สำเร็จ',signIn:'กรุณาเข้าสู่ระบบสมาชิกเพื่อดูผลการเรียนรู้',remaining:'ข้อที่เหลือ',matching:'จับคู่เครื่องมือ',scenario:'สถานการณ์',keyboard:'ฝึกคีย์ลัด',complete:'เรียนครบแล้ว',progress:'กำลังเรียน',notStarted:'ยังไม่เริ่ม',answer:'ตอบถูก',score:'คะแนน',en:'EN'},
    en:{title:'My Learning Progress',subtitle:'Track your development through Mini Tasks',completed:'Completed chapters',attempts:'Practice attempts',accuracy:'Answer accuracy',chapters:'Chapter progress',history:'Recent practice history',loading:'Loading your learning progress...',noData:'No practice data yet. Start a Mini Task to record your progress.',failed:'Unable to load progress',signIn:'Please sign in as a site member to view your learning results',remaining:'remaining',matching:'Tool matching',scenario:'Scenario',keyboard:'Keyboard practice',complete:'Completed',progress:'In progress',notStarted:'Not started',answer:'Correct',score:'Score',en:'TH'}
  };
  function t(k){return strings[lang][k]||k;}
  function text(id,value){document.getElementById(id).textContent=value;}
  function render(data,history){
    text('title',t('title'));text('subtitle',t('subtitle'));
    text('completed-label',t('completed'));text('attempts-label',t('attempts'));text('accuracy-label',t('accuracy'));
    text('chapter-heading',t('chapters'));text('activity-heading',t('history'));text('language',t('en'));
    text('completed',(data.completedChapterCount||0)+'');
    text('attempts',(data.totalAttempts||0)+'');
    text('accuracy',(data.accuracyPercent||0)+'%');
    var chapters=document.getElementById('chapters');
    if(!data.chapters||!data.chapters.length){chapters.innerHTML='<div class="status">'+t('noData')+'</div>';}
    else{
      chapters.innerHTML=data.chapters.map(function(ch){
        var title=(ch.title&&ch.title[lang])||ch.chapterId;
        var status=ch.status==='completed'?t('complete'):ch.status==='in_progress'?t('progress'):t('notStarted');
        var percent=Number(ch.progressPercent)||0;
        return '<article class="chapter"><div class="chapter-title"><div><b>'+escapeHtml(title)+'</b><small>'+escapeHtml(status)+'</small></div><span class="percent">'+percent+'%</span></div><div class="track"><i style="width:'+percent+'%"></i></div><div class="meta"><span>'+(ch.matchingCompleted||0)+' / '+(ch.matchingTotal||0)+'</span><span>'+(ch.remaining||0)+' '+t('remaining')+'</span></div><div class="meta"><span>'+t('scenario')+': '+(ch.scenarioQuestionsResolved||0)+'</span><span>'+t('keyboard')+': '+(ch.keyboardQuestionsResolved||0)+'</span></div></article>';
      }).join('');
    }
    var log=document.getElementById('history');
    if(!history||!history.length){log.innerHTML='<div class="status">'+t('noData')+'</div>';}
    else{
      log.innerHTML=history.map(function(a){
        var ch=data.chapters.find(function(c){return c.chapterId===a.chapterId;});
        var name=ch&&ch.title?ch.title[lang]:a.chapterId;
        var mode=a.mode==='keyboard'?t('keyboard'):a.mode==='scenario'?t('scenario'):t('matching');
        var date=a.startTime?new Date(a.startTime).toLocaleString(lang==='th'?'th-TH':'en-US'):'';
        return '<article class="attempt"><div><b>'+escapeHtml(name)+'</b><small>'+escapeHtml(mode)+' · '+escapeHtml(date)+'</small></div><div class="score">'+(a.correctCount||0)+' / '+(a.totalQuestions||0)+'</div><small>'+t('score')+': '+(a.scorePercent||0)+'%</small><small>'+t('answer')+': '+(a.correctCount||0)+' / '+(a.totalAttempts||0)+'</small></article>';
      }).join('');
    }
  }
  function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function request(){
    sequence++;
    document.getElementById('chapters').innerHTML='<div class="status">'+t('loading')+'</div>';
    document.getElementById('history').innerHTML='<div class="status">'+t('loading')+'</div>';
    window.parent.postMessage({channel:'ATELIER_PROGRESS',kind:'request',requestId:'progress_'+Date.now()+'_'+sequence,method:'loadProgress'},'*');
  }
  window.addEventListener('message',function(event){
    if(event.source!==window.parent)return;
    var msg=event.data;
    if(!msg||msg.channel!=='ATELIER_PROGRESS'||msg.kind!=='response')return;
    if(!msg.ok){
      var error=String(msg.error||'');
      var message=error.indexOf('MEMBER_LOGIN_REQUIRED')>=0?t('signIn'):t('failed');
      document.getElementById('chapters').innerHTML='<div class="status error">'+message+'</div>';
      document.getElementById('history').innerHTML='';
      return;
    }
    render(msg.data.progress,msg.data.history);
  });
  document.getElementById('language').addEventListener('click',function(){lang=lang==='th'?'en':'th';text('title',t('title'));text('subtitle',t('subtitle'));request();});
  render({completedChapterCount:0,totalAttempts:0,accuracyPercent:0,chapters:[]},[]);
  request();
})();
</script>
</body>
</html>
